[package]
name = "aurasense-rs"
version = "1.0.0"
edition = "2021"
authors = ["AuraSense Project"]
description = "Rust BLE proximity lock/unlock daemon and instant Keychain auto-filler for macOS"
license = "MIT"

[dependencies]
libc = "0.2"
core-foundation = "0.9"
core-graphics = "0.23"
security-framework = "2.11"
objc2 = "0.5"
objc2-foundation = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
